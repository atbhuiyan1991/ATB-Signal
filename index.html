<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SMC Signal Engine — Binance & Bybit Futures</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>SMC Signal Engine</h1>
      <p class="subtitle">Liquidity Sweep → MSS → Order Block Retest (Binance &amp; Bybit Futures)</p>
    </div>
    <div class="controls">
      <select id="exchangeMode" title="Exchange Mode">
        <option value="BOTH">Both (Binance + Bybit)</option>
        <option value="BINANCE">Binance Only</option>
        <option value="BYBIT">Bybit Only</option>
      </select>
      <select id="stateFilter" title="Signal State Filter">
        <option value="ALL">All States</option>
        <option value="VALID SETUP">VALID SETUP</option>
        <option value="WAIT">WAIT</option>
        <option value="WATCH">WATCH</option>
        <option value="REJECT">REJECT</option>
        <option value="EXPIRED">EXPIRED</option>
      </select>
      <button id="scanBtn" class="btn-primary">Scan Now</button>
      <button id="autoBtn" class="btn-secondary">Auto: OFF</button>
    </div>
  </header>

  <main class="container">
    <section class="stats-grid" id="statsGrid">
      <div class="stat-card"><span>Scanned Coins</span><strong id="statScanned">0</strong></div>
      <div class="stat-card"><span>Watchlist</span><strong id="statWatchlist">0</strong></div>
      <div class="stat-card valid"><span>Valid Setups</span><strong id="statValid">0</strong></div>
      <div class="stat-card"><span>Last Scan</span><strong id="statTime">—</strong></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Detected Setups &amp; Watchlist States</h2>
        <span id="statusText" class="status-text">Ready</span>
      </div>
      <div id="signalsList" class="signals-grid"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Event &amp; Alert Log</h2>
        <button id="clearLogBtn" class="btn-ghost">Clear Log</button>
      </div>
      <ul id="logList" class="log-list"></ul>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/exchanges/binance.js"></script>
  <script src="js/exchanges/bybit.js"></script>
  <script src="js/exchanges/marketAdapter.js"></script>
  <script src="js/analysis.js"></script>
  <script src="js/scanner.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
